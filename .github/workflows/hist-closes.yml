name: hist-closes
# 눌림 검증용 전 종목 종가 저장 (수동 1회)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/hist_closes.py
      - run: |
          git config user.name "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hist/closes.json.gz
          git commit -m "hist: closes for pullback study [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
