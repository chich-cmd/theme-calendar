name: probe-nxt-sources
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: python
        run: |
          import json, os, urllib.request
          os.makedirs("probe", exist_ok=True)
          for f in os.listdir("probe"): os.remove(os.path.join("probe", f))
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126 Safari/537.36"}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=25) as r:
                  return json.loads(r.read().decode())
          out = []
          tests = {
            "batch5": "https://polling.finance.naver.com/api/realtime/domestic/stock/005930,000660,035420,468670,136150",
            "batch60": "https://polling.finance.naver.com/api/realtime/domestic/stock/" + ",".join(f"{c:06d}" for c in [5930,660,35420,5380,51910,6400,207940,68270,35720,105560]*6),
            "up_kospi_100": "https://m.stock.naver.com/api/stocks/up/KOSPI?page=1&pageSize=100",
            "up_kosdaq_p2": "https://m.stock.naver.com/api/stocks/up/KOSDAQ?page=2&pageSize=100",
          }
          for k, u in tests.items():
              try:
                  d = get(u)
                  items = d.get("datas", d.get("stocks", []))
                  out.append(f"{k}: OK items={len(items)} total={d.get('totalCount')}")
                  if k == "batch5":
                      for it in items:
                          o = it.get("overMarketPriceInfo") or {}
                          out.append(f"   {it['stockName']} close={it['closePriceRaw']} rate={it['fluctuationsRatioRaw']} session={o.get('tradingSessionType')} status={o.get('overMarketStatus')} over={o.get('overPrice')} overRate={o.get('fluctuationsRatio')}")
                  if k.startswith("up_") and items:
                      out.append(f"   first={items[0]['stockName']} {items[0]['fluctuationsRatio']} last={items[-1]['stockName']} {items[-1]['fluctuationsRatio']}")
              except Exception as e:
                  out.append(f"{k}: FAIL {e}")
          open("probe/_index.txt", "w").write("\n".join(out) + "\n")
          print("\n".join(out))
      - name: Commit results
        run: |
          git config user.name "probe-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A probe && git commit -m "probe results [skip ci]" && git push || echo nothing
