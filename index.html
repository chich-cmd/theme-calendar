<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="평일마다 자동으로 쌓이는 한국 주식 주도 테마 달력">
<title>테마주 달력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 증권사 HTS 달력처럼 월~금 5열 격자, 칸마다 그날의 테마. 테마를 누르면 아래에서 주도주 시트가 올라온다. */
:root {
  --bg: #f6f7fa;
  --paper: #ffffff;
  --ink: #1d2340;
  --muted: #6b7190;
  --line: #d9dce8;
  --rule: #2a3160;
  --up: #d6283a;          /* 한국 시장 관례: 상승 = 빨강 */
  --up-soft: #fde8ea;
  --down: #1f5fd1;
  --after: #6d3fc0;       /* 넥장(장후) */
  --after-soft: #efe8fb;
  --holiday: #2f7d3a;
  --today: #fff6d6;
  --hl: #ffe45c;
  --hl2: #b8f07a;
  --accent: #e08a1e;
  --shadow: 0 -8px 30px rgba(20, 24, 50, .18);
  --f-display: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141f; --paper: #1a1d2b; --ink: #e6e8f2; --muted: #9399b5; --line: #2e3247; --rule: #8d96d8;
    --up: #ff5a68; --up-soft: #3a1c24; --down: #6c9dff; --after: #b89bff; --after-soft: #2b2342;
    --holiday: #6fcf7c; --hl: rgba(255, 214, 0, .38); --hl2: rgba(140, 230, 80, .38); --today: #2c2a1c; --accent: #f0a443; --shadow: 0 -8px 30px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141f; --paper: #1a1d2b; --ink: #e6e8f2; --muted: #9399b5; --line: #2e3247; --rule: #8d96d8;
  --up: #ff5a68; --up-soft: #3a1c24; --down: #6c9dff; --after: #b89bff; --after-soft: #2b2342;
  --holiday: #6fcf7c; --hl: rgba(255, 214, 0, .38); --hl2: rgba(140, 230, 80, .38); --today: #2c2a1c; --accent: #f0a443; --shadow: 0 -8px 30px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border-bottom: 2px solid var(--rule); padding-bottom: 12px; }
.eyebrow { color: var(--accent); font-weight: 700; font-size: 15px; letter-spacing: .02em; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 6vw, 42px); margin: 2px 0 0; line-height: 1.1; text-wrap: balance; }
h1 span { color: var(--muted); }
.months { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.months select { font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.mchip { position: relative; min-width: 46px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
.mchip:hover:not(:disabled) { border-color: var(--rule); }
.mchip[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 700; }
.mchip:disabled { opacity: .35; cursor: default; }
.mchip.data::after { content: ""; position: absolute; top: 3px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--up); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); margin: 12px 0 10px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

.grid-scroll { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--paper); border: 1px solid var(--line); border-top: 2px solid var(--ink); }
.dow { text-align: center; font-size: 12px; letter-spacing: .1em; color: var(--muted); padding: 8px 0; border-bottom: 1px solid var(--line); background: var(--bg); }
.cell { min-height: 118px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 5px 6px 7px;
  display: flex; flex-direction: column; gap: 2px; text-align: left; min-width: 0; }
.cell:nth-child(5n) { border-right: 0; }
.cell.has { cursor: pointer; }
.cell.has:hover { background: color-mix(in srgb, var(--rule) 5%, var(--paper)); }
.cell.today { }
.cell.other .dnum { opacity: .45; }
.dnum { font-family: var(--f-num); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
.dnum b { font-weight: 500; }
.idx { font-size: 10px; }
.t { display: block; width: 100%; text-align: left; font-size: 12.5px; line-height: 1.32; word-break: keep-all; overflow-wrap: anywhere; }
.t.lead { color: var(--ink); font-weight: 800; }
.theme-legend { display: flex; flex-wrap: wrap; gap: 5px 6px; margin: 8px 0 8px; font-size: 12px; }
.theme-legend span { color: #111; border-radius: 4px; padding: 1px 7px; }
.t.thc { background: var(--thc); color: #111; border-radius: 4px; padding: 0 4px; margin: 2px 0; }
.t.after { color: var(--after); font-size: 11.5px; }
.t.after::before { content: "장후 "; font-size: 9.5px; font-weight: 700; background: var(--after-soft); border-radius: 3px; padding: 0 3px; margin-right: 2px; }
.t:hover { text-decoration: underline; text-underline-offset: 2px; }
.more { font-size: 11px; color: var(--muted); }
.hol { color: var(--holiday); font-weight: 700; font-size: 13px; }
.pending { font-size: 11px; color: var(--muted); }

.status { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.4; }
.empty { margin-top: 14px; background: var(--paper); border: 1px dashed var(--line); border-radius: 10px; padding: 16px; font-size: 14px; line-height: 1.65; }
.empty b { color: var(--ink); }

/* 주도주 시트 */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 30, .4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 86vh; overflow-y: auto;
  background: var(--paper); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 640px; margin: 0 auto; }
.grab { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 4px auto 10px; }
.sh-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sh-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0; }
.close { font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
.mkt { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.mkt b { font-family: var(--f-num); font-weight: 500; }
.summary { font-size: 14px; line-height: 1.6; margin: 8px 0 4px; }
.sec { margin-top: 18px; }
.sec h3 { font-size: 13px; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-weight: 700; }
.sec.after h3 { color: var(--after); }
.theme { border-bottom: 1px solid var(--line); }
.th-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 2px; text-align: left; }
.th-name { font-weight: 700; font-size: 16px; }
.theme.lead .th-name { color: var(--up); }
.sec.after .th-name { color: var(--after); }
.kind { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 5px; margin-left: 6px; background: var(--after-soft); color: var(--after); vertical-align: 2px; }
.th-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
.th-meta::after { content: " ▾"; }
.theme.open .th-meta::after { content: " ▴"; }
.streak { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 13px; color: var(--muted); background: var(--up-soft); border-radius: 8px; padding: 8px 11px; margin: 0 0 10px; font-variant-numeric: tabular-nums; }
.streak b { color: var(--up); font-size: 17px; font-family: var(--f-num); font-weight: 500; }
.sec.after .streak { background: var(--after-soft); }
.sec.after .streak b { color: var(--after); }
.th-badge { font-size: 11px; font-weight: 700; color: var(--up); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; white-space: nowrap; }
.cycle { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); margin: -4px 0 10px; padding: 0 2px; font-variant-numeric: tabular-nums; }
.cycle b { color: var(--ink); font-family: var(--f-num); font-weight: 500; font-size: 14px; }
.cycle-note { font-size: 11px; opacity: .8; }
mark.hl { -webkit-box-decoration-break: clone; box-decoration-break: clone; background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%); color: inherit; }
mark.hl { padding: 0 1px; }
mark.hl.lim { background: linear-gradient(transparent 52%, var(--hl2) 52%, var(--hl2) 92%, transparent 92%); }
mark.hl.both { background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 74%, var(--hl2) 74%, var(--hl2) 96%, transparent 96%); }
.hl-note { font-size: 11.5px; color: var(--muted); margin: 2px 0 0; line-height: 1.4; }
.th-reason { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin: -4px 2px 10px; }
.stocks { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
.stk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; background: var(--bg); border-radius: 8px; padding: 9px 11px; }
.stk-name { font-weight: 700; font-size: 15px; min-width: 0; }
.amt { font-family: var(--f-num); font-weight: 500; font-size: 11.5px; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chg { font-family: var(--f-num); font-weight: 500; font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); }
.chg2 { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-size: 14px; }
.chg-row { display: inline-flex; gap: 6px; align-items: baseline; }
.chg-lab { font-family: inherit; font-size: 11px; font-weight: 600; color: var(--muted); }
.chg-row .up { color: var(--up); } .chg-row .down { color: var(--down); }
.chg-diff { font-size: 12px; margin-left: -2px; } .chg-diff:not(.up):not(.down) { color: var(--muted); }
.subgrp { margin: 0 0 4px; }
.sub-h { font-size: 12.5px; font-weight: 700; color: var(--ink); margin: 2px 2px 6px; padding-left: 8px; border-left: 3px solid var(--line); }
.sub-h span { color: var(--muted); font-weight: 500; margin-left: 2px; }
.stk-why { grid-column: 1 / -1; font-size: 13px; color: var(--muted); line-height: 1.5; }
.chip { font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 1px 5px; margin-left: 5px; vertical-align: 2px; }
.chip.limit { background: var(--up); color: var(--paper); }
.chip.tag { border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.watch { font-size: 14px; line-height: 1.6; background: var(--after-soft); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
.srcs { margin-top: 18px; font-size: 12.5px; line-height: 1.7; }
.srcs a { color: var(--muted); word-break: break-all; }
.note { font-size: 11.5px; color: var(--muted); margin-top: 16px; line-height: 1.6; }

.search { position: relative; margin: 2px 0 12px; }
.search input { width: 100%; font: inherit; font-size: 15px; padding: 10px 36px 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
.search input:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
.search .clr { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--muted); padding: 4px 8px; }
.sres { margin: 0 0 16px; display: grid; gap: 10px; }
.sres .hint { font-size: 13px; color: var(--muted); }
.scard { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; background: var(--paper); }
.scard h4 { margin: 0; font-size: 16px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.scard h4 small { font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.scount { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin: 6px 0 8px; font-variant-numeric: tabular-nums; }
.scount b { color: var(--up); font-family: var(--f-num); font-weight: 500; font-size: 17px; }
.scount .af b { color: var(--after); }
.smon { display: grid; grid-template-columns: 44px 1fr; gap: 4px 6px; align-items: start; margin-top: 4px; }
.smon > span { font-size: 12.5px; font-weight: 700; color: var(--muted); padding-top: 5px; }
.sdays { display: flex; flex-wrap: wrap; gap: 5px; }
.sday { font-size: 12.5px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; background: var(--bg); font-variant-numeric: tabular-nums; text-align: left; }
.sday.lead { border-color: var(--up); color: var(--up); font-weight: 700; }
.sday.af { border-color: var(--after); color: var(--after); }
.sday em { font-style: normal; font-size: 11px; opacity: .8; margin-left: 3px; }

/* 장전 테마 예측 카드 */
.pred { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; }
.pred-h { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; }
.pred-h::-webkit-details-marker { display: none; }
.pred-h b { font-size: 15px; white-space: nowrap; }
.pred-sum { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: var(--up); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pred-tg::after { content: "펼치기 ▾"; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.pred[open] .pred-tg::after { content: "접기 ▴"; }
.pred[open] .pred-sum { visibility: hidden; }
.pred-sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.pred-us { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); margin: 6px 0 8px; font-variant-numeric: tabular-nums; }
.pred-us b { font-family: var(--f-num); font-weight: 500; color: var(--ink); }
.pred-us b.up { color: var(--up); } .pred-us b.down { color: var(--down); }
.pred ol, .sec.pre ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.pred li, .sec.pre li { display: grid; grid-template-columns: 22px 1fr; gap: 0 6px; }
.pred .no, .sec.pre .no { width: 20px; height: 20px; border-radius: 50%; background: var(--up); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.pred .tn, .sec.pre .tn { font-weight: 700; font-size: 14.5px; }
.pred .tw, .sec.pre .tw { font-size: 12.5px; color: var(--muted); line-height: 1.5; grid-column: 2; }
.pred .tw em, .sec.pre .tw em { font-style: normal; color: var(--ink); }
.pred .warn { margin-top: 9px; font-size: 12.5px; background: var(--up-soft); border-radius: 8px; padding: 7px 10px; line-height: 1.5; }
.pred .foot { margin-top: 8px; font-size: 11px; color: var(--muted); line-height: 1.5; }
.pm { margin-top: 10px; border-top: 1px dashed var(--line, #ddd); padding-top: 8px; font-size: 12.5px; line-height: 1.55; }
.pm-h { font-weight: 700; margin-bottom: 2px; } .pm-c, .pm-new { color: var(--muted); } .pm-new b { color: inherit; }
.pred .pm-l, .sheet .pm-l { margin: 4px 0 0; padding-left: 16px; list-style: disc; } .pm .pm-l li { display: list-item; margin: 2px 0; padding: 0; border: 0; grid-template-columns: none; }
.hitmark { font-size: 12px; font-weight: 700; margin-left: 6px; white-space: nowrap; font-family: var(--f-body); }
.hitmark.hit-ok { color: var(--up); } .hitmark.hit-mid { color: var(--accent); } .hitmark.hit-no { color: var(--muted); }
.sec.pre h3 { color: var(--accent); }
.sim { font-size: 12.5px; color: var(--muted); margin: -4px 2px 10px; }

@media (max-width: 560px) {
  .cell { min-height: 96px; padding: 4px 4px 6px; }
  .t { font-size: 11px; }
  .t.after { font-size: 10.5px; }
  .idx { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="ym">2026년 10월</div>
      <h1>주식 테마주 <span>달력</span></h1>
    </div>
  </header>
  <div class="search">
    <input id="q" type="text" enterkeyhint="search" placeholder="테마·종목 검색 (예: 원익IPS, 로봇)" autocomplete="off" aria-label="테마 또는 종목 검색">
    <button class="clr" id="qclr" aria-label="검색어 지우기" hidden>×</button>
  </div>
  <div class="sres" id="sres" hidden></div>
  <details class="pred" id="pred" hidden></details>
  <div class="months" id="months" role="tablist" aria-label="월 선택"></div>
  <div class="theme-legend" id="themeLegend"></div>
  <div class="grid-scroll"><div class="cal" id="cal"></div></div>
  <div id="msg"></div>
  <footer class="note" style="margin-top:28px">기사·공시와 공개 시세(네이버페이 증권)를 바탕으로 자동 정리한 개인 참고용 기록이며 투자 권유가 아닙니다.</footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden></div>

<script>
const DOW = ["MON", "TUE", "WED", "THU", "FRI"];
const WK = ["일", "월", "화", "수", "목", "금", "토"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function kstToday() {
  const d = new Date(Date.now() + 9 * 3600e3);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() };
}
const pad = (n) => String(n).padStart(2, "0");
const isoOf = (dt) => `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`;

const T = kstToday();
const todayIso = `${T.y}-${pad(T.m + 1)}-${pad(T.d)}`;
let view = { y: T.y, m: T.m };
let days = {};
let loaded = false;
let dbState = "loading"; // loading | ok | none | error
let open = null;
let monthsInfo = {};
const loadedMonths = new Set(); // { id, sec, idx }

function weekdaysOfMonth(y, m) {
  const first = new Date(Date.UTC(y, m, 1));
  const last = new Date(Date.UTC(y, m + 1, 0));
  const start = new Date(first);
  const fd = first.getUTCDay();
  if (fd === 0) start.setUTCDate(start.getUTCDate() + 1);
  else if (fd === 6) start.setUTCDate(start.getUTCDate() + 2);
  else start.setUTCDate(start.getUTCDate() - (fd - 1));
  const end = new Date(last);
  const ld = last.getUTCDay();
  if (ld === 0) end.setUTCDate(end.getUTCDate() - 2);
  else if (ld === 6) end.setUTCDate(end.getUTCDate() - 1);
  else end.setUTCDate(end.getUTCDate() + (5 - ld));

  "우주항공":"#c79bdb","방산":"#c9c27a","보안":"#9fb3bb","전자부품":"#f6cfae","디스플레이":"#e9e2c9","엔터·미디어":"#f1c0e6","디지털자산":"#ffd9a3"};
// 테마 색: 최근 2개월(그 날짜까지) 안에 2번 이상 등장한 테마만 칠한다
function themeColor(name, dayId) {
  const c = THEME_PAL[name];
  if (!c) return null;
  const d = new Date(dayId + "T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() - 2);
  const from = d.toISOString().slice(0, 10);
  let n = 0;
  for (const [id, doc] of Object.entries(days)) {
    if (id <= from || id > dayId || !doc || !doc.main) continue;
    if ((doc.main.themes || []).some((t) => t.name === name) && ++n >= 2) return c;
  }
  return null;
}
function renderThemeLegend() {
  const el = document.getElementById("themeLegend");
  if (!el) return;
  const seen = new Map();
  for (const [n, c] of Object.entries(THEME_PAL)) {
    if (seen.has(c)) { seen.get(c).push(n); continue; }
    seen.set(c, [n]);
  }
  el.innerHTML = [...seen].map(([c, ns]) => `<span style="background:${c}">${esc(ns.length > 1 && ns[0] === "반도체" ? "반도체·후공정" : ns.join("·"))}</span>`).join("");
}
function hlName(name, i, top, lim) {
  return esc(name);   // 노란·연두 형광펜(종목 수·상한가 1등)은 테마 색으로 바꾸면서 뺐다
}
function cycleStats(name, dayId) {
  const start = threeMonthStart(dayId);
  const ids = Object.keys(days).filter((id) => id > start && id <= dayId && days[id] && days[id].status !== "holiday" && ((days[id].main && days[id].main.themes) || []).length).sort();
  const leadIdx = [];
  ids.forEach((id, i) => { if (days[id].main.themes.some((t) => t.name === name && t.lead)) leadIdx.push(i); });
  if (leadIdx.length < 3) return null;
  const gaps = leadIdx.slice(1).map((v, i) => v - leadIdx[i]);
  const avg = (a) => a.reduce((s, x) => s + x, 0) / a.length;
  const runs = [];
  let r = 1;
  for (const g of gaps) { if (g === 1) r++; else { runs.push(r); r = 1; } }
  runs.push(r);
  const back = gaps.filter((g) => g > 1);
  const since = ids.length - 1 - leadIdx[leadIdx.length - 1];
  return { every: avg(gaps), back: back.length ? avg(back) : null, run: avg(runs), since };
}
function cycleHtml(name, dayId) {
  const c = cycleStats(name, dayId);
  if (!c) return "";
  const f = (v) => (Math.round(v * 10) / 10).toString();
  const parts = [`평균 <b>${f(c.every)}</b>거래일마다 주도`, `한 번에 ${f(c.run)}일 지속`];
  if (c.back !== null) parts.push(`쉬었다 다시 오기까지 ${f(c.back)}일`);
  parts.push(c.since === 0 ? "오늘 주도" : `마지막 주도 후 ${c.since}거래일째`);
  return `<div class="cycle">${parts.map((p) => `<span>${p}</span>`).join("")}<span class="cycle-note">최근 3개월 기록만 계산</span></div>`;
}
function themesHtml(id, sec, themes) {
  return themes.map((t, i) => {
    const isOpen = open && open.id === id && open.sec === sec && open.idx === i;
    const kind = sec === "after" && t.kind ? `<span class="kind">${esc(t.kind)}</span>` : "";
    const st = themeStats(t.name, id);
    return `<div class="theme${t.lead ? " lead" : ""}${isOpen ? " open" : ""}">
      <button class="th-btn" data-id="${id}" data-sec="${sec}" data-idx="${i}" aria-expanded="${isOpen}">
        <span class="th-name">${sec === "main" ? hlName(t.name, i, topThemeIdx(themes), limitThemeIdx(themes)) : esc(t.name)}${kind}${st.lead > 1 ? `<span class="th-badge">3개월 주도 ${st.lead}회</span>` : ""}</span>
        <span class="th-meta">주도주 ${(t.stocks || []).length}</span>
      </button>
      ${isOpen ? `<div class="streak"><span>최근 3개월 주도 테마 <b>${st.lead}</b>회</span><span>테마 등장 ${st.seen}회</span><span>기록 ${st.base}거래일 기준</span></div>${sec === "main" ? cycleHtml(t.name, id) : ""}${sec === "main" ? simHtml(t.name, id) : ""}${t.reason ? `<p class="th-reason">${esc(t.reason)}</p>` : ""}${stocksHtml(t.stocks)}` : ""}
    </div>`;
  }).join("");
}

function renderSheet() {
  if (!open || !days[open.id]) { closeSheet(); return; }
  const d = days[open.id];
  const dt = new Date(open.id + "T00:00:00Z");
  const main = d.main || {}, after = d.after || {};
  const srcs = [...(main.sources || []), ...(after.sources || [])];
  let h = `<div class="grab"></div><div class="sh-head"><div>
      <h2 id="shTitle">${dt.getUTCMonth() + 1}월 ${dt.getUTCDate()}일 (${WK[dt.getUTCDay()]})</h2>
      ${main.kospi != null || main.kosdaq != null ? `<div class="mkt"><span>코스피 <b>${esc(main.kospi ?? "-")}</b></span><span>코스닥 <b>${esc(main.kosdaq ?? "-")}</b></span></div>` : ""}
    </div><button class="close" id="closeBtn">닫기</button></div>`;
  if (main.summary) h += `<p class="summary">${esc(main.summary)}</p>`;
  if (main.basis) h += `<p class="th-reason" style="margin:0">${esc(main.basis)}</p>`;
  if (d.pre && (d.pre.themes || []).length) {
    const hit = preHit(d);
    h += `<div class="sec pre"><h3>장전 예측 ${esc(d.pre.time || "")}${hit ? ` · ${hit.total}개 중 주도 ${hit.hit} · 급등 테마 포함 ${hit.hit + hit.marks.filter((m) => m.mark === "mid").length}` : ""}</h3>${preListHtml(d.pre, hit, open.id)}${newsHtml(d.pre)}${pmHtml(d.pre, d)}</div>`;
  }
  h += `<div class="sec"><h3>본장 테마</h3>${(main.themes || []).length ? themesHtml(open.id, "main", main.themes) : '<p class="th-reason">아직 집계 전입니다 (16:40 무렵).</p>'}</div>`;
  h += `<div class="sec after"><h3>넥장 · 장후 테마</h3>${(after.themes || []).length ? themesHtml(open.id, "after", after.themes) : `<p class="th-reason">${after.updatedAt ? "장후 특이 움직임이 적었습니다." : "아직 집계 전입니다 (20:50 무렵)."}</p>`}
    ${after.watch ? `<div class="watch"><b>내일 주목</b> · ${esc(after.watch)}</div>` : ""}</div>`;
  if (srcs.length) h += `<div class="srcs"><b>출처</b><br>${srcs.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>`).join("<br>")}</div>`;
  h += `<p class="note">기사·공시를 바탕으로 자동 정리한 기록이며 투자 권유가 아닙니다. 등락률은 출처 기준 근사치일 수 있습니다.</p>`;
  $("sheet").innerHTML = h;
  $("sheet").hidden = false;
  $("scrim").hidden = false;
  $("closeBtn").onclick = closeSheet;
}
async function ensureRange(dayId) {
  const start = threeMonthStart(dayId);
  const keys = Object.keys(monthsInfo).filter((k) => k >= start.slice(0, 7) && k <= dayId.slice(0, 7) && !loadedMonths.has(k));
  if (!keys.length) return;
  keys.forEach((k) => loadedMonths.add(k));
  try {
    const docs = await Promise.all(keys.map((k) => fetchJson(`themes/${k}.json`)));
    docs.forEach((d) => { if (d) Object.assign(days, d); });
  } catch (e) {}
  renderCal();
  if (open) { const y = $("sheet").scrollTop; renderSheet(); $("sheet").scrollTop = y; }
}
function openSheet(id, sec = null, idx = null) {
  ensureRange(id);
  if (!days[id] || days[id].status === "holiday") return;
  if (sec === null) {
    const d = days[id];
    if ((d.main?.themes || []).length) { sec = "main"; idx = 0; }
    else if ((d.after?.themes || []).length) { sec = "after"; idx = 0; }
  }
  open = { id, sec, idx };
  renderSheet();
  $("sheet").scrollTop = 0;
  requestAnimationFrame(() => {
    const el = $("sheet").querySelector(".theme.open");
    if (el && el.offsetTop > $("sheet").clientHeight * 0.5) el.scrollIntoView({ block: "start" });
  });
}
function closeSheet() { open = null; $("sheet").hidden = true; $("scrim").hidden = true; }

$("cal").addEventListener("click", (e) => {
  const t = e.target.closest(".t");
  if (t) { openSheet(t.dataset.id, t.dataset.sec, +t.dataset.idx); return; }
  const c = e.target.closest(".cell.has");
  if (c) openSheet(c.dataset.id);
});
$("sheet").addEventListener("click", (e) => {
  const b = e.target.closest(".th-btn");
  if (!b) return;
  const same = open && open.sec === b.dataset.sec && open.idx === +b.dataset.idx;
  open = { id: b.dataset.id, sec: same ? null : b.dataset.sec, idx: same ? null : +b.dataset.idx };
  const y = $("sheet").scrollTop;
  renderSheet();
  $("sheet").scrollTop = y;
});
$("scrim").onclick = closeSheet;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
function renderMonths() {
  const withData = new Set(Object.keys(monthsInfo).filter((k) => monthsInfo[k] > 0));
  const dataYears = [...withData].map((k) => +k.slice(0, 4));
  const minY = Math.min(2025, view.y, ...dataYears);
  const ys = [];
  for (let y = T.y; y >= minY; y--) ys.push(y);
  let h = `<select id="yearSel" aria-label="연도">${ys.map((y) => `<option value="${y}"${y === view.y ? " selected" : ""}>${y}년</option>`).join("")}</select>`;
  for (let m = 0; m < 12; m++) {
    const key = `${view.y}-${pad(m + 1)}`;
    const future = view.y > T.y || (view.y === T.y && m > T.m);
    const sel = m === view.m;
    h += `<button class="mchip${withData.has(key) ? " data" : ""}" role="tab" aria-selected="${sel}" data-m="${m}"${future ? " disabled" : ""}>${m + 1}월</button>`;
  }
  $("months").innerHTML = h;
  const ysel = $("yearSel");
  if (ysel) ysel.onchange = () => { view.y = +ysel.value; if (view.y === T.y && view.m > T.m) view.m = T.m; renderCal(); };
}
$("months").addEventListener("click", (e) => {
  const b = e.target.closest(".mchip");
  if (!b || b.disabled) return;
  view.m = +b.dataset.m;
  renderCal();
});


// ---------- 검색: 테마/종목이 언제, 몇 번 올랐는지 ----------
const norm = (s) => String(s || "").toLowerCase().replace(/[\s·.,()\-_/]/g, "");
function searchIndex() {
  const themes = new Map(), stocks = new Map();
  const add = (map, name, rec) => { if (!map.has(name)) map.set(name, []); map.get(name).push(rec); };
  for (const [id, d] of Object.entries(days)) {
    if (!d || d.status === "holiday") continue;
    for (const sec of ["main", "after"]) {
      (d[sec]?.themes || []).forEach((t, idx) => {
        add(themes, t.name, { id, sec, idx, lead: !!t.lead, n: (t.stocks || []).length });
        for (const s of t.stocks || []) add(stocks, s.name, { id, sec, idx, theme: t.name, chg: s.chg, nxt: s.nxt, lead: !!t.lead });
      });
    }
  }
  return { themes, stocks };
}
function groupByMonth(recs) {
  const m = new Map();
  for (const r of [...recs].sort((a, b) => (a.id < b.id ? 1 : a.id > b.id ? -1 : a.sec === "main" ? -1 : 1))) {
    const k = r.id.slice(0, 7);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  }
  return m;
}
function monthsHtml(recs, chipFn) {
  return [...groupByMonth(recs)].map(([k, arr]) => `<div class="smon"><span>${+k.slice(5)}월</span><div class="sdays">${arr.map(chipFn).join("")}</div></div>`).join("");
}
function themeCard(name, recs) {
  const mainDays = new Set(recs.filter((r) => r.sec === "main").map((r) => r.id));
  const leadDays = new Set(recs.filter((r) => r.sec === "main" && r.lead).map((r) => r.id));
  const afDays = new Set(recs.filter((r) => r.sec === "after").map((r) => r.id));
  const chip = (r) => `<button class="sday${r.sec === "after" ? " af" : r.lead ? " lead" : ""}" data-id="${r.id}" data-sec="${r.sec}" data-idx="${r.idx}">${+r.id.slice(8)}일<em>${r.sec === "after" ? "넥장" : r.lead ? "주도" : ""} ${r.n}종목</em></button>`;
  return `<div class="scard"><h4>${esc(name)} <small>테마</small></h4>
    <div class="scount"><span>본장 등장 <b>${mainDays.size}</b>회</span><span>그중 주도 <b>${leadDays.size}</b>회</span>${afDays.size ? `<span class="af">넥장 <b>${afDays.size}</b>회</span>` : ""}</div>
    ${monthsHtml(recs, chip)}</div>`;
}
function stockCard(name, recs) {
  const dayIds = new Set(recs.map((r) => r.id));
  const mainDays = new Set(recs.filter((r) => r.sec === "main").map((r) => r.id));
  const afDays = new Set(recs.filter((r) => r.sec === "after").map((r) => r.id));
  const themeCnt = {};
  recs.forEach((r) => { themeCnt[r.theme] = (themeCnt[r.theme] || 0) + 1; });
  const topThemes = Object.entries(themeCnt).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([t, c]) => `${esc(t)} ${c}`).join(" · ");
  const chip = (r) => `<button class="sday${r.sec === "after" ? " af" : r.lead ? " lead" : ""}" data-id="${r.id}" data-sec="${r.sec}" data-idx="${r.idx}" title="${esc(r.theme)}">${+r.id.slice(8)}일 ${r.sec === "after" ? "넥장 " : ""}${typeof r.chg === "number" ? fmtChg(r.chg) : ""}<em>${esc(r.theme)}</em></button>`;
  return `<div class="scard"><h4>${esc(name)} <small>종목</small></h4>
    <div class="scount"><span>상승 기록 <b>${dayIds.size}</b>일</span><span>본장 <b>${mainDays.size}</b>회</span>${afDays.size ? `<span class="af">넥장 <b>${afDays.size}</b>회</span>` : ""}</div>
    <div class="th-reason" style="margin:0 0 6px">테마: ${topThemes}</div>
    ${monthsHtml(recs, chip)}</div>`;
}
let searchTimer = null;
async function runSearch() {
  const raw = $("q").value.trim();
  $("qclr").hidden = !raw;
  const box = $("sres");
  if (!raw) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  if (typeof ensureAll === "function" && !allLoaded) { box.innerHTML = '<p class="hint">전체 기록을 불러오는 중…</p>'; await ensureAll(); }
  const q = norm(raw);
  const { themes, stocks } = searchIndex();
  const score = (name) => { const n = norm(name); return n === q ? 0 : n.startsWith(q) ? 1 : n.includes(q) ? 2 : -1; };
  const hits = [];
  for (const [name, recs] of themes) { const s = score(name); if (s >= 0) hits.push({ s, kind: 0, name, recs }); }
  for (const [name, recs] of stocks) { const s = score(name); if (s >= 0) hits.push({ s, kind: 1, name, recs }); }
  hits.sort((a, b) => a.s - b.s || b.recs.length - a.recs.length || a.kind - b.kind);
  const ids = Object.keys(days).filter((k) => days[k]?.status !== "holiday").sort();
  const range = ids.length ? `${+ids[0].slice(5, 7)}월 ${+ids[0].slice(8)}일 ~ ${+ids.at(-1).slice(5, 7)}월 ${+ids.at(-1).slice(8)}일 기록 ${ids.length}거래일 기준` : "";
  if (!hits.length) { box.innerHTML = `<p class="hint">“${esc(raw)}” 기록이 없습니다. ${range}</p>`; return; }
  const shown = hits.slice(0, 6);
  box.innerHTML = `<p class="hint">${range} · 날짜를 누르면 그날 기록이 열립니다</p>` +
    shown.map((h) => (h.kind === 0 ? themeCard(h.name, h.recs) : stockCard(h.name, h.recs))).join("") +
    (hits.length > shown.length ? `<p class="hint">외 ${hits.length - shown.length}개 — 검색어를 더 구체적으로 입력해 보세요</p>` : "");
}
$("q").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 200); });
$("qclr").onclick = () => { $("q").value = ""; runSearch(); $("q").focus(); };
$("sres").addEventListener("click", (e) => {
  const b = e.target.closest(".sday");
  if (b) openSheet(b.dataset.id, b.dataset.sec, +b.dataset.idx);
});

renderCal();

async function fetchJson(path) {
  const r = await fetch(path + "?t=" + Math.floor(Date.now() / 300000), { cache: "no-store" });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function monthKey(y, m) { const d = new Date(Date.UTC(y, m, 1)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}`; }
async function ensureMonths() {
  const keys = [monthKey(view.y, view.m - 2), monthKey(view.y, view.m - 1), monthKey(view.y, view.m), monthKey(view.y, view.m + 1)]
    .filter((k) => !loadedMonths.has(k) && (monthsInfo[k] !== undefined || k === monthKey(view.y, view.m)));
  if (!keys.length) return;
  keys.forEach((k) => loadedMonths.add(k));
  try {
    const docs = await Promise.all(keys.map((k) => fetchJson(`themes/${k}.json`)));
    docs.forEach((d) => { if (d) Object.assign(days, d); });
    dbState = "ok";
  } catch (e) { dbState = "error"; }
  renderCal();
  if (open) renderSheet();
}
let allLoaded = false;
async function ensureAll() {
  const keys = Object.keys(monthsInfo).filter((k) => !loadedMonths.has(k));
  keys.forEach((k) => loadedMonths.add(k));
  try {
    const docs = await Promise.all(keys.map((k) => fetchJson(`themes/${k}.json`)));
    docs.forEach((d) => { if (d) Object.assign(days, d); });
    allLoaded = true;
  } catch (e) { keys.forEach((k) => loadedMonths.delete(k)); }
  renderCal();
}
// 페이지가 브라우저에 예전 버전으로 남아 있으면 최신 버전으로 한 번 새로고침
const BUILD = "2026-10-06d";
(async () => {
  try {
    const r = await fetch("index.html?b=" + Date.now(), { cache: "no-store" });
    const m = (await r.text()).match(/const BUILD = "([^"]+)"/);
    if (m && m[1] !== BUILD) {
      let tried = null;
      try { tried = sessionStorage.getItem("reloadFor"); sessionStorage.setItem("reloadFor", m[1]); } catch (e) {}
      if (tried !== m[1]) location.reload();
    }
  } catch (e) {}
})();
(async () => {
  try {
    const info = await fetchJson("themes/months.json");
    monthsInfo = (info && info.months) || {};
  } catch (e) { dbState = "error"; renderMsg(); return; }
  await ensureMonths();
  if (dbState === "loading") { dbState = "ok"; renderCal(); }
})();
